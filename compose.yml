services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imobiliaria
      MYSQL_USER: imobiliaria
      MYSQL_PASSWORD: imobiliaria
    ports:
      - "3306:3306"
    volumes:
      - ./banco-de-dados-imobiliaria.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dados_mysql:
